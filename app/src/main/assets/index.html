<!DOCTYPE html>

<title>Galaxy Icon Ai</title>
<style>
:root{--bg:#fff;--sf:#f1f5f3;--tx:#1b1f1d;--mu:#5f6b66;--ac:#0b8f5a;--ac2:#e6f5ee;--bd:#dde5e1}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Noto Sans Bengali","Kohinoor Bangla",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{padding:10px 14px 6px;display:flex;align-items:center;gap:10px}

.hl{border-radius:12px}
.hp{border-radius:50%;border:2px solid var(--ac)}
.hl img,.hp img{width:100%;height:100%;object-fit:cover;display:block}

.search{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:28px;padding:0 16px;height:44px;flex:1;min-width:0}

main{flex:1;overflow-y:auto;padding:6px 0 16px}

h2{font-size:18px;padding:16px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.card{flex:none;width:104px;text-align:left}

.row .ic{width:56px;flex:none;font-size:28px}
.hero{flex:none;width:300px;height:160px;border-radius:18px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;position:relative;overflow:hidden}
.hero b{font-size:20px}.hero small{opacity:.9}

.row{display:flex;gap:14px;align-items:center;padding:8px 14px;width:100%;text-align:left}
.row .in{flex:1;min-width:0}

.sbtn{padding:7px 16px;border-radius:20px;border:1px solid var(--bd);color:var(--ac);font-weight:600;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:50px 24px;line-height:1.6}
#det{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s;z-index:5;padding-top:env(safe-area-inset-top,0)}

.bar{position:sticky;top:0;background:var(--bg);padding:10px 8px;z-index:2}

.act{padding:6px 16px 14px;display:flex;gap:10px}

.shots{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.shot{flex:none;width:130px;height:230px;border-radius:14px;display:grid;place-items:center;font-size:48px;color:#fff;position:relative}
.shot small{position:absolute;bottom:10px;font-size:12px;left:0;right:0;text-align:center}
.sec{padding:0 16px}
.sec p{line-height:1.65;color:var(--mu);font-size:14.5px}
.rv{padding:12px 0;border-bottom:1px solid var(--bd)}
.rv b{font-size:14px}.rv .s{color:#f5a623;font-size:13px;letter-spacing:1px}.rv p{margin-top:4px}
.stars{display:flex;gap:6px;font-size:30px;color:var(--bd);padding:6px 0}

textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;padding:10px;min-height:70px;resize:none;outline:0}

nav button{font-size:11px}
main input,main select,main textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;padding:12px;outline:0;margin-top:10px}

.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.info{padding:0 18px 4px;font-size:13.5px;color:var(--mu);line-height:1.7}
#run.web{justify-content:flex-start;padding:0;gap:0;align-items:stretch;text-align:left}
.rbar{display:flex;align-items:center;gap:12px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#111;color:#fff}

#run iframe{flex:1;width:100%;border:0;background:#fff}
#apkh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:center;padding:20px}
#apkh .bx{background:var(--bg);color:var(--tx);border-radius:18px;padding:18px;max-width:380px;line-height:1.75;font-size:14.5px}

.dt{position:absolute;right:14px;bottom:16px;display:flex;gap:5px;z-index:2}

#amsg>*{flex:none}
#amsg .rs{background:var(--sf)}
.demo{margin:0 16px;padding:10px 12px;background:var(--ac2);color:var(--ac);border-radius:12px;font-size:13px;line-height:1.5}

</style>
</head>

var sc=b.split(":")[0].toLowerCase(),rest=b.replace(/^https?:\/\//i,"");

<script>
/* ===== Firebase সংযোগ (অ্যাডমিন ও ইউজার ফাইল একই ডাটাবেস ব্যবহার করে) ===== */

var DLC={};
function dlText(a){return bn(DLC[a.id]||0)+" বার"}
function fbCount(id){
  DLC[id]=(DLC[id]||0)+1;
  if(!FB.db)return;
  try{FB.db.ref("downloads/"+fbEnc(id)).set(firebase.database.ServerValue.increment(1)).catch(function(e){console.warn("ডাউনলোড গণনা ব্যর্থ:",e&&e.message||e)})}catch(e){}

    var v=s.val()||{},o={};
    Object.keys(v).forEach(function(k){if(v[k]!=null)o[fbDec(k)]=+v[k]||0});

function fbEnc(k){return encodeURIComponent(String(k)).replace(/\./g,"%2E")}
function fbDec(k){try{return decodeURIComponent(k)}catch(e){return k}}
function fbClean(v){return v==null?null:JSON.parse(JSON.stringify(v))}
function fbSort(v){
  if(Array.isArray(v))return v.map(fbSort);
  if(v&&typeof v=="object"){var o={};Object.keys(v).sort().forEach(function(k){if(v[k]!=null)o[k]=fbSort(v[k])});return o}
  return v;
}
function fbCanon(v){return JSON.stringify(fbSort(v==null?null:v))}
function fbObjList(v){
  if(!v)return [];
  if(Array.isArray(v))return v.filter(Boolean);

/* ছবি/ফাইল — লোকাল IndexedDB হেল্পার (আবার আপলোড ট্রিগার করে না) */
function fbLocalPut(key,val){try{if(DB)DB.transaction("f","readwrite").objectStore("f").put(val,key)}catch(e){}}
function fbLocalDel(key){try{if(DB)DB.transaction("f","readwrite").objectStore("f").delete(key)}catch(e){}}

function fbAssetPut(key,val){
  if(!FB.db)return;
  try{
    if(typeof val==="string")FB.db.ref("img/"+fbEnc(key)).set(val).catch(function(e){console.warn("ছবি আপলোড ব্যর্থ:",e&&e.message||e)});
    else if(val&&val.size!=null&&String(key).indexOf("file:")==0)fbFilePut(key,val);
  }catch(e){console.warn(e)}
}
function fbAssetDel(key){
  if(!FB.db)return;
  try{
    if(String(key).indexOf("file:")==0){var ek=fbEnc(String(key).slice(5));FB.db.ref("files/"+ek).remove();FB.db.ref("filechunks/"+ek).remove()}
    else FB.db.ref("img/"+fbEnc(key)).remove();
  }catch(e){}
}
function fbFilePut(key,blob){
  var id=String(key).slice(5),ek=fbEnc(id),fr=new FileReader();
  fr.onload=function(){
    var s=String(fr.result),CH=800000,n=Math.ceil(s.length/CH),v=Date.now(),ps=[];
    FB.db.ref("filechunks/"+ek).remove().then(function(){
      for(var i=0;i<n;i++)ps.push(FB.db.ref("filechunks/"+ek+"/c"+i).set(s.substr(i*CH,CH)));
      return Promise.all(ps);
    }).then(function(){
      try{localStorage.setItem("fbfv:"+id,String(v))}catch(e){}
      return FB.db.ref("files/"+ek).set({n:blob.name||"",c:n,v:v});
    }).catch(function(e){console.warn("Firebase ফাইল আপলোড ব্যর্থ:",e&&e.message||e)});
  };
  fr.readAsDataURL(blob);
}
function fbFileGet(id,cb){
  if(!FB.db)return cb(null);
  var ek=fbEnc(id);
  FB.db.ref("files/"+ek).once("value").then(function(m){
    if(!m.exists())return cb(null);
    var n=m.val().c;
    return FB.db.ref("filechunks/"+ek).once("value").then(function(s){
      var o=s.val()||{},t="";
      for(var i=0;i<n;i++){if(o["c"+i]==null)return cb(null);t+=o["c"+i]}
      return fetch(t).then(function(r){return r.blob()}).then(function(b){cb(b)});
    });
  }).catch(function(){cb(null)});
}
function fbMigFiles(){
  if(!DB||!FB.db)return;
  try{
    var q=DB.transaction("f").objectStore("f").openCursor();
    q.onsuccess=function(){
      var c=q.result;if(!c)return;
      if(typeof c.value!="string"&&String(c.key).indexOf("file:")==0){
        (function(key,val){
          FB.db.ref("files/"+fbEnc(key.slice(5))).once("value").then(function(s){if(!s.exists())fbFilePut(key,val)});
        })(c.key,c.value);
      }
      c.continue();
    };
  }catch(e){}
}

function fbAssets(){
  FB.db.ref("img").on("value",function(snap){
    var rem=snap.val()||{},first=!FB.imgReady,ch=0;
    FB.imgReady=1;
    Object.keys(rem).forEach(function(ek){
      var key=fbDec(ek);
      if(IMG[key]!==rem[ek]){IMG[key]=rem[ek];fbLocalPut(key,rem[ek]);ch=1}
    });
    Object.keys(IMG).forEach(function(key){
      if(rem[fbEnc(key)]==null){
        if(first)fbAssetPut(key,IMG[key]);
        else{delete IMG[key];fbLocalDel(key);ch=1}
      }
    });
    if(ch)fbSoft();
  },function(e){console.warn("Firebase ছবি পড়া ব্যর্থ:",e&&e.message||e)});
  FB.db.ref("files").on("value",function(snap){
    var m=snap.val()||{};
    Object.keys(m).forEach(function(ek){
      var id=fbDec(ek),v=String((m[ek]&&m[ek].v)||0),k="fbfv:"+id,old=null;
      try{old=localStorage.getItem(k)}catch(e){}
      if(old!==v){if(old!==null)fbLocalDel("file:"+id);try{localStorage.setItem(k,v)}catch(e){}}
    });
  });
  fbMigFiles();
}

/* চালু করার ফাংশন — লোকাল ডাটা লোড হওয়ার পর ডাকতে হবে */
function fbStart(){
  if(!FB.db||!FB.A||FB.started)return;
  FB.started=true;
  Object.keys(FB_SEC).forEach(function(sec){
    var S2=FB_SEC[sec];
    FB.db.ref("shared/"+sec).on("value",function(snap){
      var rv=snap.exists()?S2.from(snap.val()):null,loc=FB.A.get(sec),nv;
      if(!FB.ready[sec]){
        FB.ready[sec]=1;
        nv=S2.merge(loc,rv);
        var rc=fbCanon(rv==null?null:S2.to(rv)),nc=fbCanon(S2.to(nv));
        if(rc!==nc)fbPushSec(sec,nv);
        FB.last[sec]=nc;
      }else{
        nv=rv==null?S2.empty():rv;
        FB.last[sec]=fbCanon(S2.to(nv));
      }
      if(fbCanon(S2.to(nv))!==fbCanon(S2.to(loc))){
        FB.A.set(sec,nv);FB.A.persist();
        try{FB.A.refresh()}catch(e){}
      }
    },function(e){console.warn("Firebase পড়া ব্যর্থ ("+sec+"):",e&&e.message||e)});
  });
  fbAssets();
  fbDlWatch();
}
